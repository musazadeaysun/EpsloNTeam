<!doctype html>

    <link rel="stylesheet" href="/style.css" />

  <body>
    <!-- header -->
    <div class="intro-header">

        src="image/headerImg/header.svg"

      <div class="intro">

            <img src="image/iconImg/globe.svg" alt="globe" />

            <img src="image/iconImg/calendar_2.svg" alt="calendar" />

        <div class="intro-text">

              Зритель для меня не потребитель моей продукции, не судья, а
